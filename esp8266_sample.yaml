esphome:
  name: kaeltebringer
  friendly_name: Clim name

esp8266:
  board: esp_wroom_02

external_components:
  - source: github://les4g/esphome-kaeltebringer?rev=1

logger:

status_led:
    pin: GPIO5

uart:
  id: uart_bus
  tx_pin: 15
  rx_pin: 13
  baud_rate: 9600
  parity: EVEN

climate:
  - platform: kaeltebringer
    id: kb_ac
    uart_id: uart_bus
    name: "A/C"
    beep_enabled: true
    display_enabled: true

switch:
  - platform: template
    name: "A/C Bip"
    id: kb_beep_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(kb_ac).set_beep_enabled(true);
    turn_off_action:
      - lambda: |-
          id(kb_ac).set_beep_enabled(false);

  - platform: template
    name: "A/C Afficheur"
    id: kb_display_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(kb_ac).set_display_enabled(true);
    turn_off_action:
      - lambda: |-
          id(kb_ac).set_display_enabled(false);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Clim Fallback Hotspot"
    password: "xxxxxxxx"

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxx"

ota:
  - platform: esphome
    password: "xxxxxxx"
